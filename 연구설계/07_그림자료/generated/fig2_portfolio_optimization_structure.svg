<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650">
  <defs>
    <style>
      text { font-family:"Malgun Gothic","Batang",serif; fill:#111827; }
      .title { font-size:34px; font-weight:700; }
      .box { stroke:#0b2a5b; stroke-width:3; rx:16; ry:16; }
      .head { font-size:24px; font-weight:700; }
      .body { font-size:19px; }
      .arrow { stroke:#0b2a5b; stroke-width:4; marker-end:url(#arrow); }
      .line { stroke:#64748b; stroke-width:3; stroke-dasharray:8 6; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#0b2a5b"/>
    </marker>
  </defs>
  <text x="620" y="55" text-anchor="middle" class="title">Portfolio Optimization Structure for Asset Investment Planning</text>

  <rect x="60" y="170" width="245" height="260" fill="#eaf4ff" class="box"/>
  <text x="182" y="215" text-anchor="middle" class="head">Input Data</text>
  <text x="182" y="260" text-anchor="middle" class="body">CostPV</text>
  <text x="182" y="292" text-anchor="middle" class="body">Investment Value</text>
  <text x="182" y="324" text-anchor="middle" class="body">Asset-Level PI</text>
  <text x="182" y="356" text-anchor="middle" class="body">Integrated PI</text>
  <text x="182" y="388" text-anchor="middle" class="body">SAIDI·리스크</text>

  <rect x="390" y="250" width="220" height="100" fill="#fff7e6" class="box"/>
  <text x="500" y="292" text-anchor="middle" class="head">Decision Variable</text>
  <text x="500" y="325" text-anchor="middle" class="body">x(i,t) ∈ {0,1}</text>

  <rect x="380" y="95" width="470" height="105" fill="#f0f7ff" class="box"/>
  <text x="615" y="135" text-anchor="middle" class="head">Objective Functions</text>
  <text x="615" y="170" text-anchor="middle" class="body">Investment Value / Asset-Level PI / Integrated PI</text>

  <rect x="380" y="410" width="470" height="130" fill="#f8fafc" class="box"/>
  <text x="615" y="450" text-anchor="middle" class="head">Constraints</text>
  <text x="615" y="485" text-anchor="middle" class="body">Budget · Quantity · Non-duplicate Replacement</text>
  <text x="615" y="518" text-anchor="middle" class="body">Candidate Set · KPI Constraints</text>

  <rect x="940" y="170" width="245" height="260" fill="#e9f8ef" class="box"/>
  <text x="1062" y="215" text-anchor="middle" class="head">Output Portfolio</text>
  <text x="1062" y="260" text-anchor="middle" class="body">Selected Assets</text>
  <text x="1062" y="292" text-anchor="middle" class="body">Replacement Year</text>
  <text x="1062" y="324" text-anchor="middle" class="body">Total Cost</text>
  <text x="1062" y="356" text-anchor="middle" class="body">Risk Reduction</text>
  <text x="1062" y="388" text-anchor="middle" class="body">SAIDI Improvement · PI</text>

  <line x1="305" y1="300" x2="390" y2="300" class="arrow"/>
  <line x1="610" y1="300" x2="940" y2="300" class="arrow"/>
  <line x1="500" y1="250" x2="560" y2="200" class="line"/>
  <line x1="500" y1="350" x2="560" y2="410" class="line"/>
  <line x1="850" y1="148" x2="940" y2="245" class="arrow"/>
  <line x1="850" y1="475" x2="940" y2="360" class="arrow"/>
</svg>

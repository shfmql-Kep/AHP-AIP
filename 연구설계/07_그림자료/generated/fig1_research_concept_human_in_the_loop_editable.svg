<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font-family: "HCR Batang", "함초롬바탕", "Batang", "Times New Roman", serif; font-size: 34px; font-weight: 700; fill: #0b2a55; }
      .label { font-family: "HCR Batang", "함초롬바탕", "Batang", serif; font-size: 32px; font-weight: 700; fill: #111827; }
      .sub { font-family: "HCR Batang", "함초롬바탕", "Batang", serif; font-size: 24px; fill: #374151; }
      .small { font-family: "HCR Batang", "함초롬바탕", "Batang", serif; font-size: 22px; fill: #4b5563; }
      .box-main { fill: #eaf4ff; stroke: #0b2a55; stroke-width: 3; rx: 24; ry: 24; }
      .box-index { fill: #edf7f0; stroke: #0b2a55; stroke-width: 3; rx: 24; ry: 24; }
      .box-opt { fill: #eef0f5; stroke: #0b2a55; stroke-width: 3; rx: 24; ry: 24; }
      .box-decision { fill: #0b2a55; stroke: #0b2a55; stroke-width: 3; rx: 24; ry: 24; }
      .box-decision-text { font-family: "HCR Batang", "함초롬바탕", "Batang", serif; font-size: 32px; font-weight: 700; fill: #ffffff; }
      .band-human { fill: #fff4dd; stroke: #b87914; stroke-width: 2.5; rx: 26; ry: 26; }
      .box-human { fill: #fffaf0; stroke: #b87914; stroke-width: 2.5; rx: 18; ry: 18; }
      .box-valid { fill: #f3f4f6; stroke: #6b7280; stroke-width: 2.5; rx: 18; ry: 18; }
      .arrow { stroke: #0b2a55; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHead); }
      .arrow-thin { stroke: #0b2a55; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHeadSmall); }
      .arrow-human { stroke: #b87914; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHeadHuman); }
      .arrow-valid { stroke: #6b7280; stroke-width: 4; fill: none; stroke-dasharray: 10 8; stroke-linecap: round; marker-end: url(#arrowHeadGray); }
      .icon-line { stroke: #0b2a55; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: #0b2a55; }
      .icon-human { stroke: #b87914; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .note { font-family: "HCR Batang", "함초롬바탕", "Batang", serif; font-size: 22px; fill: #6b7280; }
    </style>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b2a55"/>
    </marker>
    <marker id="arrowHeadSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b2a55"/>
    </marker>
    <marker id="arrowHeadHuman" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b87914"/>
    </marker>
    <marker id="arrowHeadGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Main workflow boxes -->
  <rect class="box-main" x="70" y="240" width="235" height="145"/>
  <rect class="box-main" x="370" y="240" width="235" height="145"/>
  <rect class="box-index" x="670" y="220" width="260" height="185"/>
  <rect class="box-opt" x="995" y="240" width="235" height="145"/>
  <rect class="box-decision" x="1295" y="240" width="235" height="145"/>

  <!-- Arrows in main workflow -->
  <path class="arrow" d="M 305 312 L 355 312"/>
  <path class="arrow" d="M 605 312 L 655 312"/>
  <path class="arrow" d="M 930 312 L 980 312"/>
  <path class="arrow" d="M 1230 312 L 1280 312"/>

  <!-- Main text -->
  <text class="label" x="187.5" y="300" text-anchor="middle">자산·리스크</text>
  <text class="label" x="187.5" y="342" text-anchor="middle">데이터</text>

  <text class="label" x="487.5" y="300" text-anchor="middle">투자효과</text>
  <text class="label" x="487.5" y="342" text-anchor="middle">평가</text>

  <text class="label" x="800" y="284" text-anchor="middle">다기준</text>
  <text class="label" x="800" y="326" text-anchor="middle">투자우선순위</text>
  <text class="label" x="800" y="368" text-anchor="middle">지수</text>

  <text class="label" x="1112.5" y="300" text-anchor="middle">포트폴리오</text>
  <text class="label" x="1112.5" y="342" text-anchor="middle">최적화</text>

  <text class="box-decision-text" x="1412.5" y="300" text-anchor="middle">투자계획</text>
  <text class="box-decision-text" x="1412.5" y="342" text-anchor="middle">의사결정</text>

  <!-- Minimal icons -->
  <g transform="translate(158 167)">
    <ellipse class="icon-line" cx="30" cy="76" rx="45" ry="15"/>
    <path class="icon-line" d="M -15 76 L -15 30 C -15 20 75 20 75 30 L 75 76"/>
    <path class="icon-line" d="M -15 30 C -15 40 75 40 75 30"/>
    <path class="icon-line" d="M -15 53 C -15 63 75 63 75 53"/>
  </g>

  <g transform="translate(455 168)">
    <path class="icon-line" d="M 0 80 L 25 50 L 50 65 L 85 20"/>
    <path class="icon-line" d="M 0 95 H 100"/>
    <path class="icon-line" d="M 85 20 H 62"/>
    <path class="icon-line" d="M 85 20 V 43"/>
  </g>

  <g transform="translate(762 150)">
    <circle class="icon-line" cx="38" cy="38" r="31"/>
    <path class="icon-line" d="M 38 20 V 42 L 55 55"/>
    <path class="icon-line" d="M 10 87 H 66"/>
    <path class="icon-line" d="M 38 69 V 87"/>
  </g>

  <g transform="translate(1072 168)">
    <rect class="icon-line" x="0" y="25" width="18" height="65"/>
    <rect class="icon-line" x="34" y="5" width="18" height="85"/>
    <rect class="icon-line" x="68" y="45" width="18" height="45"/>
    <path class="icon-line" d="M -5 95 H 95"/>
  </g>

  <g transform="translate(1377 168)">
    <rect class="icon-line" x="0" y="5" width="70" height="90" rx="8"/>
    <path class="icon-line" d="M 18 52 L 32 66 L 56 34"/>
  </g>

  <!-- Human-in-the-loop band -->
  <rect class="band-human" x="360" y="575" width="870" height="170"/>
  <text class="title" x="795" y="625" text-anchor="middle">전문가 참여형 의사결정</text>

  <rect class="box-human" x="480" y="655" width="230" height="62"/>
  <text class="sub" x="595" y="694" text-anchor="middle">가중치 설정</text>

  <rect class="box-human" x="885" y="655" width="230" height="62"/>
  <text class="sub" x="1000" y="694" text-anchor="middle">결과 해석</text>

  <path class="arrow-human" d="M 595 655 C 630 565 720 500 770 415"/>
  <path class="arrow-human" d="M 1000 655 C 1115 590 1255 500 1360 394"/>

  <!-- Validation node -->
  <rect class="box-valid" x="1045" y="470" width="290" height="72"/>
  <text class="sub" x="1190" y="514" text-anchor="middle">민감도·강건성 검토</text>
  <path class="arrow-valid" d="M 1112 385 L 1165 462"/>
  <path class="arrow-valid" d="M 1300 506 C 1355 490 1395 445 1405 394"/>

  <!-- Bottom interpretation labels -->
  <text class="note" x="187.5" y="440" text-anchor="middle">정량 데이터</text>
  <text class="note" x="800" y="445" text-anchor="middle">전문가 판단의 정량화</text>
  <text class="note" x="1112.5" y="440" text-anchor="middle">최적 포트폴리오 탐색</text>
  <text class="note" x="1412.5" y="440" text-anchor="middle">해석과 선택</text>

  <!-- Subtle background guide -->
  <path d="M 70 520 H 1530" stroke="#e5e7eb" stroke-width="2"/>
</svg>

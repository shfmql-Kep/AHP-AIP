<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<defs>
  <style>
    text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans CJK KR", Arial, sans-serif; fill: #111827; }
    .title { font-size: 27px; font-weight: 700; fill: #0B2A5B; }
    .subtitle { font-size: 15px; fill: #4B5563; }
    .label { font-size: 15px; fill: #111827; }
    .small { font-size: 12px; fill: #374151; }
    .tiny { font-size: 10px; fill: #4B5563; }
    .box-title { font-size: 16px; font-weight: 700; fill: #111827; }
    .box-text { font-size: 13px; fill: #374151; }
  </style>
  <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
    <path d="M0,0 L11,5.5 L0,11 Z" fill="#0B2A5B" />
  </marker>
  <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#6B7280" />
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#9CA3AF" flood-opacity="0.25"/>
  </filter>
</defs>
<text x="750.0" y="52.0" class="title" text-anchor="middle">통합 PI 산출 및 적용 절차</text>
<text x="750.0" y="80.0" class="subtitle" text-anchor="middle">설비 단위 PI에 설비유형 계층 가중치를 결합하여 시스템 관점의 후보군을 재평가</text>
<rect x="80" y="155" width="320" height="110" rx="18" fill="#EAF3FF" stroke="#2F80ED" stroke-width="2.2" filter="url(#shadow)"/>
<text x="240.0" y="190.0" class="box-title" text-anchor="middle">설비 단위 PI</text>
<text x="240.0" y="220.0" class="box-text" text-anchor="middle">경제성·신뢰도·안전·환경</text>
<text x="240.0" y="239.0" class="box-text" text-anchor="middle">하위지표 가중합</text>
<rect x="80" y="345" width="320" height="110" rx="18" fill="#EAF8F0" stroke="#2EAD72" stroke-width="2.2" filter="url(#shadow)"/>
<text x="240.0" y="380.0" class="box-title" text-anchor="middle">설비유형 계층 가중치</text>
<text x="240.0" y="410.0" class="box-text" text-anchor="middle">전문가 설문 기반</text>
<text x="240.0" y="429.0" class="box-text" text-anchor="middle">설비군 간 상대 중요도</text>
<rect x="555" y="250" width="360" height="120" rx="20" fill="#FFFDF4" stroke="#E07B00" stroke-width="2.3" filter="url(#shadow)"/>
<text x="735.0" y="285.0" class="box-title" text-anchor="middle" style="font-weight:700">통합 PI</text>
<text x="735.0" y="320.0" class="box-text" text-anchor="middle">Integrated PI = Asset PI × Type Weight</text>
<text x="735.0" y="348.0" class="box-text" text-anchor="middle">1차 후보군 내부에서 재평가</text>
<polyline points="400,210 490,210 490,292 555,292" fill="none" stroke="#6B7280" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="400,400 490,400 490,328 555,328" fill="none" stroke="#6B7280" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="1060" y="160" width="330" height="95" rx="18" fill="#F2EFFF" stroke="#7B61FF" stroke-width="2.2" filter="url(#shadow)"/>
<text x="1225.0" y="196.0" class="box-title" text-anchor="middle">통합 후보군 재선정</text>
<text x="1225.0" y="226.0" class="box-text" text-anchor="middle">PI 기반 1차 후보군 대상</text>
<rect x="1060" y="345" width="330" height="95" rx="18" fill="#F3F4F6" stroke="#0B2A5B" stroke-width="2.2" filter="url(#shadow)"/>
<text x="1225.0" y="381.0" class="box-title" text-anchor="middle">시스템 단위 최적화</text>
<text x="1225.0" y="411.0" class="box-text" text-anchor="middle">연도별 예산·물량 제약 적용</text>
<polyline points="915,310 990,310 990,208 1060,208" fill="none" stroke="#0B2A5B" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="1225" y1="255" x2="1225" y2="345" stroke="#0B2A5B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="465" y="575" width="570" height="70" rx="18" fill="#FFFFFF" stroke="#0B2A5B" stroke-width="2.2" />
<text x="750.0" y="617.0" class="box-title" text-anchor="middle">출력: 통합 PI, 선택 설비, 투자비용, Risk 저감량, SAIDI 개선량</text>
<polyline points="1225,440 1225,610 1035,610" fill="none" stroke="#6B7280" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>
